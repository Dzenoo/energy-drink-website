<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The ICO for browsers and tools that ask for /favicon.ico, the SVG for
         sharp tabs in modern browsers, and a full-square PNG for iOS home screens. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The browser bar on phones in the studio's black. -->
    <meta name="theme-color" content="#050608" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>DRINK · Strawberry energy</title>
    <meta
      name="description"
      content="Dive into a can of strawberry energy drink, from the cold can down through the fizz. A fictional brand, made as a portfolio project."
    />
    <!-- The studio's black before any script or stylesheet arrives, so the page never flashes white. -->
    <style>
      html {
        background: #050608;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
